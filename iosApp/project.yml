# Xcode project for the iOS host app, generated with XcodeGen: `brew install xcodegen && xcodegen generate`.
# Generating keeps the .xcodeproj out of version control; the Kotlin framework is built by Gradle in a build phase.
name: iosApp
options:
  bundleIdPrefix: com.gayatripatel
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  iosApp:
    type: application
    platform: iOS
    sources: [iosApp]
    scheme: {}
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: HireReel
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Compose Multiplatform renders at the display's full refresh rate (ProMotion) only with this key.
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: HireReel records your answers to interview questions.
        NSMicrophoneUsageDescription: HireReel records audio with your video answers.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gayatripatel.hirereel.kmp
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework ComposeApp"
        # The Gradle build phase reads and writes outside the sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
