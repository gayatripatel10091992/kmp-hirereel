name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Shared tests, Android + Desktop builds, desktop screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Shared module tests (JVM + Android unit)
        run: ./gradlew :shared:desktopTest :shared:testDebugUnitTest --stacktrace

      - name: Build Android APK + desktop distributable
        run: ./gradlew :composeApp:assembleDebug :composeApp:createDistributable --stacktrace

      - name: Render desktop screenshots (Compose Multiplatform on JVM/Skia)
        run: |
          ./gradlew :composeApp:desktopTest --stacktrace
          mkdir -p docs/screenshots/desktop
          cp composeApp/build/screenshots/desktop/*.png docs/screenshots/desktop/

      - uses: actions/upload-artifact@v4
        with:
          name: hirereel-android-apk
          path: composeApp/build/outputs/apk/debug/*.apk

      - name: Commit updated screenshots
        if: github.event_name != 'pull_request'
        run: bash .github/scripts/commit-screenshots.sh docs/screenshots/desktop "Desktop"

  android:
    name: Android emulator screenshots
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hirereel-android-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/capture-android.sh "$(ls apk/*.apk | head -n 1)"
      - uses: actions/upload-artifact@v4
        with:
          name: hirereel-android-screenshots
          path: docs/screenshots/android/*.png
      - name: Commit updated screenshots
        if: github.event_name != 'pull_request'
        run: bash .github/scripts/commit-screenshots.sh docs/screenshots/android "Android"

  ios:
    name: iOS shared tests, app build, simulator screenshots
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Select Xcode 16 (the newest Kotlin 2.1 supports)
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Shared tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build the iOS app for the simulator
        run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug
          -sdk iphonesimulator -destination "generic/platform=iOS Simulator" ARCHS=arm64
          -derivedDataPath iosApp/build CODE_SIGNING_ALLOWED=NO build

      - name: Run on the simulator and capture screenshots
        run: bash .github/scripts/capture-ios.sh iosApp/build/Build/Products/Debug-iphonesimulator/iosApp.app

      - uses: actions/upload-artifact@v4
        with:
          name: hirereel-ios-screenshots
          path: docs/screenshots/ios/*.png
      - name: Commit updated screenshots
        if: github.event_name != 'pull_request'
        run: bash .github/scripts/commit-screenshots.sh docs/screenshots/ios "iOS"
