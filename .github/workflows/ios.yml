name: iOS

# Shared tests on the iOS simulator and a link of the Compose Multiplatform iOS framework.
# Separate from CI because macOS runners are slower and not always available; start it from the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

jobs:
  ios:
    name: Shared tests on iOS simulator + ComposeApp framework
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared tests on iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace
      - name: Link Compose Multiplatform framework for iOS
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace
